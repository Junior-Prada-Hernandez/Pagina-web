<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | Cuenca Alta del Río Ubaté</title>
    <style>
        /* ESTILOS GENERALES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            color: white;
            text-align: center;
            background: #1a3c1a; /* Color de respaldo */
        }

        /* ANIMACIÓN DEL FONDO MEJORADA */
        .carrusel {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            animation: cambiarFondo 21s infinite ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        @keyframes cambiarFondo {
            0% { 
                background-image: url('assets/img/imagen5.jpeg');
                opacity: 1;
            }
            25% { 
                background-image: url('assets/img/imagen5.jpeg');
                opacity: 1;
            }
            30% { 
                opacity: 0.7;
            }
            35% { 
                background-image: url('assets/img/imagen4.jpeg');
                opacity: 1;
            }
            60% { 
                background-image: url('assets/img/imagen4.jpeg');
                opacity: 1;
            }
            65% { 
                opacity: 0.7;
            }
            70% { 
                background-image: url('assets/img/imagen6.jpeg');
                opacity: 1;
            }
            95% { 
                background-image: url('assets/img/imagen6.jpeg');
                opacity: 1;
            }
            100% { 
                opacity: 0.7;
            }
        }

        /* HEADER */
        header {
            padding: 20px;
            text-align: left;
            position: relative;
            z-index: 10;
        }

        .admin-btn {
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .admin-btn:hover {
            background-color: rgba(0, 0, 0, 0.9);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        /* CONTENEDOR PRINCIPAL */
        .welcome-container {
            position: relative;
            margin-top: 20vh;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 15px;
            display: inline-block;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            z-index: 10;
        }

        h1 {
            font-size: clamp(1.8em, 4vw, 2.8em);
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            line-height: 1.3;
        }

        p {
            font-size: clamp(1em, 2vw, 1.3em);
            margin-bottom: 35px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
            line-height: 1.5;
            max-width: 600px;
        }

        .enter-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 18px 40px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .enter-btn:hover {
            background: linear-gradient(135deg, #45a049, #4CAF50);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* ANIMACIÓN DE HOJAS MEJORADA */
        .leaf-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            animation: falling linear infinite;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));
            will-change: transform;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        @keyframes falling {
            0% {
                transform: translate(0, -10%) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.7;
            }
            100% {
                transform: translate(var(--random-x), 100vh) rotate(360deg) scale(1);
                opacity: 0;
            }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .welcome-container {
                margin-top: 15vh;
                padding: 25px;
            }
            
            header {
                text-align: center;
                padding: 15px;
            }
            
            .admin-btn {
                padding: 10px 20px;
                font-size: 0.8em;
            }
            
            .enter-btn {
                padding: 15px 30px;
                font-size: 1.1em;
            }
        }

        @media (max-width: 480px) {
            .welcome-container {
                margin-top: 10vh;
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            p {
                font-size: 0.9em;
            }
        }

        /* LOADING MEJORADO */
        .loading-fallback {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2d5a2d, #1a3c1a);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading inicial -->
    <div class="loading-fallback" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <!-- Carrusel de fondos -->
    <div class="carrusel" id="carrusel"></div>

    <header>
        <a href="login.html" class="admin-btn">Ingresar como Administrador</a>
    </header>

    <main>
        <div class="welcome-container">
            <h1>Bienvenido a la Cuenca Alta del Río Ubaté</h1>
            <p>Explora la riqueza natural y cultural de esta región única</p>
            <a href="index.html" class="enter-btn">Ingresar al Mapa</a>
        </div>
    </main>

    <!-- Animación de hojas -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Ocultar loading
            setTimeout(() => {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(() => loading.remove(), 500);
                }
            }, 1000);

            // 1. Crear contenedor de hojas
            const leafContainer = document.createElement('div');
            leafContainer.className = 'leaf-container';
            document.body.appendChild(leafContainer);

            // 2. Rutas de imágenes SVG
            const leafTypes = [
                'url("assets/img/hoja1.svg")',
                'url("assets/img/hoja2.svg")',
                'url("assets/img/hoja3.svg")'
            ];

            // 3. Precargar imágenes de fondo
            const preloadImages = () => {
                const images = [
                    'assets/img/imagen4.jpeg',
                    'assets/img/imagen5.jpeg', 
                    'assets/img/imagen6.jpeg'
                ];
                
                images.forEach(src => {
                    const img = new Image();
                    img.src = src;
                });
            };
            
            preloadImages();

            // 4. Crear hojas con mejor rendimiento
            const createLeaf = (index) => {
                setTimeout(() => {
                    const leaf = document.createElement('div');
                    leaf.className = 'leaf';
                    
                    // Configuración aleatoria mejorada
                    const size = Math.random() * 40 + 25; // 25-65px
                    const duration = Math.random() * 20 + 15; // 15-35s
                    const startX = Math.random() * 100;
                    const rotation = Math.random() * 720; // Más rotación
                    
                    // Aplicar estilos
                    leaf.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        background-image: ${leafTypes[Math.floor(Math.random() * leafTypes.length)]};
                        left: ${startX}%;
                        top: -${size}px;
                        --random-x: ${(Math.random() * 150 - 75)}px;
                        animation-duration: ${duration}s;
                        animation-delay: ${Math.random() * 10}s;
                        transform: rotate(${rotation}deg);
                        opacity: 0;
                    `;
                    
                    leafContainer.appendChild(leaf);
                    
                    // Reiniciar animación de forma más eficiente
                    const resetLeaf = () => {
                        if (!leaf.parentNode) return;
                        
                        leaf.style.left = `${Math.random() * 100}%`;
                        leaf.style.top = `-${size}px`;
                        leaf.style.setProperty('--random-x', `${(Math.random() * 150 - 75)}px`);
                        
                        // Forzar reflow de manera segura
                        requestAnimationFrame(() => {
                            leaf.style.animation = 'none';
                            requestAnimationFrame(() => {
                                leaf.style.animation = `falling ${duration}s linear infinite ${Math.random() * 10}s`;
                            });
                        });
                    };

                    // Usar animationend en lugar de animationiteration para mejor compatibilidad
                    leaf.addEventListener('animationend', resetLeaf);
                    
                }, index * 500); // Espaciado más amplio entre creación de hojas
            };

            // Crear menos hojas para mejor rendimiento (8 en lugar de 15)
            for (let i = 0; i < 8; i++) {
                createLeaf(i);
            }

            // 5. Manejo de errores de imágenes
            const carrusel = document.getElementById('carrusel');
            if (carrusel) {
                carrusel.addEventListener('error', (e) => {
                    console.log('Error cargando imagen de fondo');
                    carrusel.style.background = 'linear-gradient(135deg, #2d5a2d, #1a3c1a)';
                }, true);
            }

            // 6. Prevenir clics múltiples rápidos
            let lastClickTime = 0;
            document.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', (e) => {
                    const now = Date.now();
                    if (now - lastClickTime < 1000) {
                        e.preventDefault();
                    }
                    lastClickTime = now;
                });
            });
        });

        // 7. Manejar errores globales
        window.addEventListener('error', (e) => {
            console.log('Error en la página:', e.error);
        });
    </script>
</body>
</html>
